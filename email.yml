---
- name: Sends email notifications based on the current workflow
  hosts: localhost
  vars:
    - aap_hostname: "aap-aio.lab.roldo.io"
    - aap_user: "ro_user"
    - aap_password: "P@ssw0rd!"
  tasks:
    - name: Get email job information
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/jobs/{{ tower_job_id }}/"
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: email_job_info

    - name: Get source workflow job information
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ email_job_info.json.related.source_workflow_job }}"
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: email_workflow_job_info

    - name: Debug variable
      ansible.builtin.debug:
        var: email_workflow_job_info

    - name: Get source workflow nodes information
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ email_workflow_job_info.json.related.workflow_nodes }}"
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: email_workflow_nodes_info

    - name: Get main workflow job information
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/workflow_jobs/{{ email_workflow_nodes_info.json.results[0].summary_fields.job.id }}/"
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: email_main_workflow_job_info

    - name: Get user information from main workflow job
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ email_main_workflow_job_info.json.launched_by.url }}" # /api/v2/workflow_jobs/ID/
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: email_user_info

    - name: Send email notification
      community.general.mail:
        host: "smtp.corp.redhat.com"
        port: 587
        secure: starttls
        sender: "romorale-aap@redhat.com"
        to: "romorale@redhat.com"
        subject: "Notificación de finalización del job {{ email_main_workflow_job_info.json.name }} #{{ email_main_workflow_job_info.json.id }}"
        body: "{{ lookup('template', 'email_template.j2') }}"
