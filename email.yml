---
- name: Sends email notifications based on the current workflow
  hosts: localhost
  vars:
    - aap_hostname: "aap-cn01.tam.lab"
    - aap_user: "ro_user"
    - aap_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          35393332396238373662393532303366363534316562616131303762313765313666643937333463
          3737316533396638346639333366653632626465366136360a633734383038303838656362393630
          30383263346332363362663661333563393661623565616437376637376138393538353238373261
          3365303039306437310a383263616234663131376163623263653430346261643436343233396565
          3966
  tasks:
    - name: Get email job information
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/v2/jobs/{{ tower_job_id }}/"
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: email_job_info

    - name: Get source workflow job information
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ email_job_info.json.related.source_workflow_job }}"
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: email_workflow_job_info

    - name: Get source workflow nodes information
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ email_workflow_job_info.json.related.workflow_nodes }}"
        url_username: "{{ aap_user }}"
        url_password: "{{ aap_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: email_workflow_nodes_info

    - name: Debug email workflow nodes information
      ansible.builtin.debug:
        var: email_workflow_nodes_info.json